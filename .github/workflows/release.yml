name: Release

# Cuts a GitHub Release + Homebrew formula update on every `v*` tag push.
# Steps:
#   1. git tag v0.1.0
#   2. git push --tags
#   3. (this workflow) goreleaser builds darwin/amd64 + darwin/arm64,
#      uploads tarballs + checksums to a GitHub Release, and pushes
#      Formula/launchtui.rb to Tho391/homebrew-tap.
#
# Required secrets (configure once in repo Settings → Secrets):
#   - GITHUB_TOKEN      : provided automatically, used for the Release.
#   - HOMEBREW_TAP_TOKEN: PAT with `repo` scope on Tho391/homebrew-tap.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    name: goreleaser
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # GoReleaser needs the full tag history to build the changelog.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
